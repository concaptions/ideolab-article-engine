name: Daily articles

# Two workers off one repo, one per site, as agreed. They run in parallel and
# one failing does not stop the other.

# There is no schedule block here any more, on purpose. GitHub's own scheduler
# was given three windows on 6 October 2026, at 06:00, 10:08 and 11:03 UTC, and
# fired at none of them. No run was queued, no run was skipped, and GitHub keeps
# no record of a schedule it does not run, so there was nothing to read. Every
# manual dispatch in the same hours succeeded.
#
# The timing now comes from an IdeoLab workflow called "Daily Articles Trigger":
# an Every Day trigger and one HTTP request to the dispatch API below. Its first
# scheduled firing was 11:00:03 UTC on 6 October, three seconds late, and both
# sites came out of it. If the articles ever stop, look at that workflow's Runs
# tab first, not here.
#
# That trigger was moved on 8 October 2026 to 11 am America/New_York, weekends
# included, so the articles land in the American working day rather than its
# night. The zone is set by name rather than by offset, so the hour is expected
# to hold when American daylight saving ends on 1 November. That has not been
# through a change of season yet, so it is worth a look on 2 November.
# The repository's default token is read only, checked on 8 October 2026. The
# run needs to write when it tops up the topic list from the ICP, so the
# permission is granted here rather than widened across every workflow.
permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      site:
        description: Run one site only, or both
        type: choice
        options: [both, ideolab, strategicmarketer]
        default: both
      status:
        description: published or draft
        type: choice
        options: [published, draft]
        default: published

jobs:
  article:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        site: [ideolab, strategicmarketer]
    steps:
      # Full history, because the topic step at the end rebases before it pushes
      # and a rebase on a one commit clone is not reliable.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Skip the sites this run does not want
        id: gate
        run: |
          want="${{ github.event.inputs.site || 'both' }}"
          if [ "$want" = "both" ] || [ "$want" = "${{ matrix.site }}" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      # The pool is one DataForSEO call per topic, thirty of them, about eighty
      # cents a site. It is good for a week, so it is carried between runs
      # instead of being bought again every morning. The key carries the site
      # config hash, so editing the topic list buys a fresh pool on the next run
      # and nothing else does.
      - name: Reuse the keyword pool between runs
        if: steps.gate.outputs.run == 'yes'
        uses: actions/cache@v4
        with:
          path: memory/autopilot/keyword-pool-${{ matrix.site }}.json
          key: keyword-pool-${{ matrix.site }}-${{ hashFiles(format('sites/{0}.json', matrix.site)) }}-${{ github.run_id }}
          restore-keys: |
            keyword-pool-${{ matrix.site }}-${{ hashFiles(format('sites/{0}.json', matrix.site)) }}-

      # Two articles a site a day, asked for on 8 October 2026. The engine writes
      # exactly one article per invocation, so it is invoked twice rather than
      # changed. The second pass picks a different keyword on its own, because by
      # then the first article counts as already covered. They also come out a few
      # minutes apart instead of together, which reads better on the listing page.
      # A failure in the first pass does not cancel the second; the step still
      # fails the job so the failure email goes out.
      - name: Write and publish two articles
        if: steps.gate.outputs.run == 'yes'
        env:
          IDEOLAB_API_KEY: ${{ secrets.IDEOLAB_API_KEY }}
          STRATEGIC_API_KEY: ${{ secrets.STRATEGIC_API_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          KIE_AI_API_KEY: ${{ secrets.KIE_AI_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          WRITER_PROVIDER: ${{ secrets.WRITER_PROVIDER }}
          WRITER_MODEL: ${{ secrets.WRITER_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          fail=0
          for n in 1 2; do
            echo "::group::Article $n of 2"
            node scripts/engine/run.mjs --site ${{ matrix.site }} --status ${{ github.event.inputs.status || 'published' }} || fail=1
            echo "::endgroup::"
          done
          exit $fail

      - name: Keep the cover that was generated
        if: steps.gate.outputs.run == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: cover-${{ matrix.site }}
          path: content/*/images/*.png
          if-no-files-found: ignore

      # The topic list is topped up after the articles, not before, because the
      # two articles just written are what made it shorter. always() is the point
      # of this step: a run that failed because nothing was left is exactly the
      # run that has to refill the list.
      #
      # Nothing happens on most days. The script counts what is left first and
      # exits without spending anything while that count is above its floor.
      - name: Top up the topic list from the site's own documents
        id: topics
        if: always() && steps.gate.outputs.run == 'yes'
        env:
          IDEOLAB_API_KEY: ${{ secrets.IDEOLAB_API_KEY }}
          STRATEGIC_API_KEY: ${{ secrets.STRATEGIC_API_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          WRITER_PROVIDER: ${{ secrets.WRITER_PROVIDER }}
          WRITER_MODEL: ${{ secrets.WRITER_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          KIE_AI_API_KEY: ${{ secrets.KIE_AI_API_KEY }}
        run: node scripts/engine/topics.mjs --site ${{ matrix.site }}

      # Both sites run at once and both push to main. They touch different files,
      # so a rebase settles it; the retry is for the moment where the other site
      # pushed between this job's fetch and its push.
      - name: Commit the new topics
        if: always() && steps.gate.outputs.run == 'yes' && steps.topics.outputs.changed == 'yes'
        run: |
          git config user.name "Usama"
          git config user.email "concaption@gmail.com"
          git add sites/${{ matrix.site }}.json topics/${{ matrix.site }}.md
          git commit -m "Top up the ${{ matrix.site }} topic list from its own documents"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "attempt $i did not land, the other site probably pushed first"
            sleep 5
          done
          echo "could not push the new topics after five attempts"
          exit 1
