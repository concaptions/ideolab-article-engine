name: Daily articles

# Two workers off one repo, one per site, as agreed. They run in parallel and
# one failing does not stop the other.

on:
  schedule:
    # TEMPORARY, 6 October 2026. 10:08 UTC is a one off, to watch the schedule
    # fire end to end, because it never has. Put it back to '17 6 * * *', which
    # is 11:17 in Pakistan, as soon as the test run has been seen.
    #
    # Deliberately not on the hour, either way: GitHub runs every repository's
    # hourly schedules in the same burst and drops or delays what it cannot
    # fit, and 0 6 did not fire at all this morning.
    - cron: '8 10 * * *'
  workflow_dispatch:
    inputs:
      site:
        description: Run one site only, or both
        type: choice
        options: [both, ideolab, strategicmarketer]
        default: both
      status:
        description: published or draft
        type: choice
        options: [published, draft]
        default: published

jobs:
  article:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        site: [ideolab, strategicmarketer]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Skip the sites this run does not want
        id: gate
        run: |
          want="${{ github.event.inputs.site || 'both' }}"
          if [ "$want" = "both" ] || [ "$want" = "${{ matrix.site }}" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      # The pool is one DataForSEO call per topic, thirty of them, about eighty
      # cents a site. It is good for a week, so it is carried between runs
      # instead of being bought again every morning. The key carries the site
      # config hash, so editing the topic list buys a fresh pool on the next run
      # and nothing else does.
      - name: Reuse the keyword pool between runs
        if: steps.gate.outputs.run == 'yes'
        uses: actions/cache@v4
        with:
          path: memory/autopilot/keyword-pool-${{ matrix.site }}.json
          key: keyword-pool-${{ matrix.site }}-${{ hashFiles(format('sites/{0}.json', matrix.site)) }}-${{ github.run_id }}
          restore-keys: |
            keyword-pool-${{ matrix.site }}-${{ hashFiles(format('sites/{0}.json', matrix.site)) }}-

      - name: Write and publish one article
        if: steps.gate.outputs.run == 'yes'
        env:
          IDEOLAB_API_KEY: ${{ secrets.IDEOLAB_API_KEY }}
          STRATEGIC_API_KEY: ${{ secrets.STRATEGIC_API_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          KIE_AI_API_KEY: ${{ secrets.KIE_AI_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          WRITER_PROVIDER: ${{ secrets.WRITER_PROVIDER }}
          WRITER_MODEL: ${{ secrets.WRITER_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/engine/run.mjs --site ${{ matrix.site }} --status ${{ github.event.inputs.status || 'published' }}

      - name: Keep the cover that was generated
        if: steps.gate.outputs.run == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: cover-${{ matrix.site }}
          path: content/*/images/*.png
          if-no-files-found: ignore
