name: Daily articles

# Two workers off one repo, one per site, as agreed. They run in parallel and
# one failing does not stop the other.

# There is no schedule block here any more, on purpose. GitHub's own scheduler
# was given three windows on 6 October 2026, at 06:00, 10:08 and 11:03 UTC, and
# fired at none of them. No run was queued, no run was skipped, and GitHub keeps
# no record of a schedule it does not run, so there was nothing to read. Every
# manual dispatch in the same hours succeeded.
#
# The timing now comes from an IdeoLab workflow called "Daily Articles Trigger":
# an Every Day trigger and one HTTP request to the dispatch API below. Its first
# scheduled firing was 11:00:03 UTC on 6 October, three seconds late, and both
# sites came out of it. If the articles ever stop, look at that workflow's Runs
# tab first, not here.
#
# That trigger was moved on 8 October 2026 to 11 am America/New_York, weekends
# included, so the articles land in the American working day rather than its
# night. The zone is set by name rather than by offset, so the hour is expected
# to hold when American daylight saving ends on 1 November. That has not been
# through a change of season yet, so it is worth a look on 2 November.
# The repository's default token is read only, checked on 8 October 2026. The
# run needs to write when it tops up the topic list from the ICP, so the
# permission is granted here rather than widened across every workflow.
# issues: write was added on 14 October 2026 for the failure report at the end.
permissions:
  contents: write
  issues: write

on:
  workflow_dispatch:
    inputs:
      site:
        description: Run one site only, or both
        type: choice
        options: [both, ideolab, strategicmarketer]
        default: both
      simulate_failure:
        description: Fail on purpose, to test the alerts. Writes nothing and spends nothing
        type: choice
        options: ['no', 'yes']
        default: 'no'
      status:
        description: published or draft
        type: choice
        options: [published, draft]
        default: published
      check_only:
        description: Only check that every key works and has credit, after a top up. Writes nothing
        type: choice
        options: ['no', 'yes']
        default: 'no'

jobs:
  article:
    runs-on: ubuntu-latest
    # Read at job level so the last step can test it in its own if, which cannot
    # see an env set on the step itself.
    env:
      N8N_ALERT_URL: ${{ secrets.N8N_ALERT_URL }}
    # 90, not 50: up to four tries a site, each with up to two rounds of covers.
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        site: [ideolab, strategicmarketer]
    steps:
      # Full history, because the topic step at the end rebases before it pushes
      # and a rebase on a one commit clone is not reliable.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Skip the sites this run does not want
        id: gate
        run: |
          want="${{ github.event.inputs.site || 'both' }}"
          if [ "$want" = "both" ] || [ "$want" = "${{ matrix.site }}" ]; then
            echo "run=yes" >> "$GITHUB_OUTPUT"
          else
            echo "run=no" >> "$GITHUB_OUTPUT"
          fi

      # The pool is one DataForSEO call per topic, thirty of them, about eighty
      # cents a site. It is good for a week, so it is carried between runs
      # instead of being bought again every morning. The key carries the site
      # config hash, so editing the topic list buys a fresh pool on the next run
      # and nothing else does.
      - name: Reuse the keyword pool between runs
        if: steps.gate.outputs.run == 'yes'
        uses: actions/cache@v4
        with:
          path: memory/autopilot/keyword-pool-${{ matrix.site }}.json
          key: keyword-pool-${{ matrix.site }}-${{ hashFiles(format('sites/{0}.json', matrix.site)) }}-${{ github.run_id }}
          restore-keys: |
            keyword-pool-${{ matrix.site }}-${{ hashFiles(format('sites/{0}.json', matrix.site)) }}-

      # Two articles a site a day, asked for on 8 October 2026. The engine writes
      # exactly one article per invocation, so it is invoked twice rather than
      # changed. The second pass picks a different keyword on its own, because by
      # then the first article counts as already covered. They also come out a few
      # minutes apart instead of together, which reads better on the listing page.
      # A failure in one pass does not cancel the next, and a failed pass is
      # retried, see the loop below.
      #
      # Everything is copied into run.log as well. The console output sits inside
      # a collapsed group, so on a failed run the surface of the page says only
      # "Process completed with exit code 1" and the real reason has to be opened
      # by hand. The last step reads run.log and puts the reason where it can be
      # seen without opening anything.
      - name: Write and publish two articles
        if: steps.gate.outputs.run == 'yes'
        env:
          IDEOLAB_API_KEY: ${{ secrets.IDEOLAB_API_KEY }}
          STRATEGIC_API_KEY: ${{ secrets.STRATEGIC_API_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          KIE_AI_API_KEY: ${{ secrets.KIE_AI_API_KEY }}
          CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
          CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
          CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
          WRITER_PROVIDER: ${{ secrets.WRITER_PROVIDER }}
          WRITER_MODEL: ${{ secrets.WRITER_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          # Without pipefail the pipe below reports tee's exit code, not node's,
          # so a failed article still read as success. That is how 15 October
          # published nothing on either site and raised no alert.
          set -o pipefail
          fail=0

          # A way to prove the failure path still works without spending a cent.
          # The failing node process goes through the same pipe as a real
          # article, so this also proves the step sees node's exit code. It
          # stops here either way; no article is written.
          if [ "${{ github.event.inputs.simulate_failure }}" = "yes" ]; then
            node -e "console.log('Error: simulated failure, asked for by whoever started this run. Nothing was written and nothing was spent.'); process.exit(1)" 2>&1 | tee -a run.log || fail=1
            exit $fail
          fi
          # Every account is asked before anything is spent, see preflight.mjs.
          # This runs that check alone. A failed check fails the job, so the
          # failure email names the account that cannot pay.
          if [ "${{ github.event.inputs.check_only }}" = "yes" ]; then
            node scripts/engine/run.mjs --site ${{ matrix.site }} --check 2>&1 | tee -a run.log || fail=1
            exit $fail
          fi
          # Up to four tries to get two articles, asked for on 25 October 2026.
          # Until then the engine ran exactly twice, so one failure left the
          # night one article short: 23 October published one Strategic
          # Marketer article after a cover was rejected three times. A try that
          # fails is followed by another until two are live. The step fails, and
          # the failure email goes out, only if two could not be published.
          #
          # Exit code 2 is the account check refusing, added on 26 October 2026.
          # An empty account stays empty for the rest of the night, so there is
          # no next try.
          published=0
          for n in 1 2 3 4; do
            [ "$published" -ge 2 ] && break
            echo "::group::Try $n, $published of 2 published so far"
            set +e
            node scripts/engine/run.mjs --site ${{ matrix.site }} --status ${{ github.event.inputs.status || 'published' }} 2>&1 | tee -a run.log
            code=${PIPESTATUS[0]}
            set -e
            echo "::endgroup::"
            if [ "$code" = 0 ]; then
              published=$((published + 1))
            elif [ "$code" = 2 ]; then
              echo "An account cannot pay, so no more tries tonight" | tee -a run.log
              break
            fi
          done
          echo "$published of 2 published" | tee -a run.log
          [ "$published" -ge 2 ] || exit 1

      - name: Keep the cover that was generated
        if: steps.gate.outputs.run == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: cover-${{ matrix.site }}
          path: content/*/images/*.png
          if-no-files-found: ignore

      # The topic list is topped up after the articles, not before, because the
      # two articles just written are what made it shorter. always() is the point
      # of this step: a run that failed because nothing was left is exactly the
      # run that has to refill the list.
      #
      # Nothing happens on most days. The script counts what is left first and
      # exits without spending anything while that count is above its floor.
      - name: Top up the topic list from the site's own documents
        id: topics
        if: always() && steps.gate.outputs.run == 'yes' && github.event.inputs.check_only != 'yes'
        env:
          IDEOLAB_API_KEY: ${{ secrets.IDEOLAB_API_KEY }}
          STRATEGIC_API_KEY: ${{ secrets.STRATEGIC_API_KEY }}
          DATAFORSEO_LOGIN: ${{ secrets.DATAFORSEO_LOGIN }}
          DATAFORSEO_PASSWORD: ${{ secrets.DATAFORSEO_PASSWORD }}
          WRITER_PROVIDER: ${{ secrets.WRITER_PROVIDER }}
          WRITER_MODEL: ${{ secrets.WRITER_MODEL }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          KIE_AI_API_KEY: ${{ secrets.KIE_AI_API_KEY }}
        run: |
          set -o pipefail
          node scripts/engine/topics.mjs --site ${{ matrix.site }} 2>&1 | tee -a run.log

      # Both sites run at once and both push to main. They touch different files,
      # so a rebase settles it; the retry is for the moment where the other site
      # pushed between this job's fetch and its push.
      #
      # autostash was added on 14 October 2026. Writing an article updates
      # memory/autopilot/engine-ledger.json, which is tracked, so by the time this
      # step runs there is always a modified file that was never staged, and a
      # rebase refuses to start on a dirty tree. All five attempts failed on that
      # same line and the run went red for a reason that had nothing to do with
      # the topics. The step copies its output to run.log now as well, so the
      # failure report can quote the reason instead of saying it found none.
      - name: Commit the new topics
        if: always() && steps.gate.outputs.run == 'yes' && steps.topics.outputs.changed == 'yes'
        run: |
          exec > >(tee -a run.log) 2>&1
          git config user.name "Usama"
          git config user.email "192884996+concaptions@users.noreply.github.com"
          git add sites/${{ matrix.site }}.json topics/${{ matrix.site }}.md
          git commit -m "Top up the ${{ matrix.site }} topic list from its own documents"
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin main && git push origin HEAD:main; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "attempt $i did not land, the other site probably pushed first"
            sleep 5
          done
          echo "could not push the new topics after five attempts"
          exit 1

      # Nothing above here tells anyone that the run failed. The articles stopped
      # on 12 October 2026 because the OpenAI account was out of credit, and that
      # was noticed on 14 October by looking at the site. This step closes that
      # gap three ways: the reason goes onto the run page itself, it goes into an
      # issue, and the issue is assigned so an email is sent whether or not the
      # repository is being watched. The issue also outlives the log, which GitHub
      # deletes after ninety days.
      #
      # One issue per site, reused. A second failure comments on the open issue
      # instead of opening another, otherwise a long outage leaves a column of
      # identical issues. Close the issue once it is fixed and the next failure
      # opens a fresh one.
      - name: Report the failure
        id: report
        if: failure() && steps.gate.outputs.run == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          touch run.log
          grep -hoE '(Error|FAILED)[: ].*' run.log | cut -c1-300 | sort -u | head -3 > reason.txt
          if [ ! -s reason.txt ]; then
            echo "No error line was found in run.log, so the failure is in a step that does not write to it. Open the run and read the red step." > reason.txt
          fi

          {
            echo "## ${{ matrix.site }} failed"
            echo
            echo "    $(head -1 reason.txt)"
            echo
            tail -n +2 reason.txt | sed 's/^/    /'
          } >> "$GITHUB_STEP_SUMMARY"

          {
            echo "The ${{ matrix.site }} job failed on $(date -u '+%d %B %Y at %H:%M UTC')."
            echo
            echo "What the log says:"
            echo
            sed 's/^/    /' reason.txt
            echo
            echo "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo
            echo "This issue is reused. Close it once the cause is fixed, and the next failure will open a fresh one."
          } > issue-body.md

          {
            echo "reason<<END_OF_REASON"
            cat reason.txt
            echo "END_OF_REASON"
          } >> "$GITHUB_OUTPUT"

          title="Daily articles failed: ${{ matrix.site }}"
          open=$(gh issue list --state open --limit 100 --json number,title --jq '.[] | (.number|tostring) + "|" + .title' | awk -F'|' -v t="$title" '$2 == t { print $1; exit }')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file issue-body.md
            echo "commented on the open issue number $open"
          else
            gh issue create --title "$title" --body-file issue-body.md --assignee concaptions
          fi

      # Shahzaib asked on 14 October 2026 that these failures also reach a
      # personal inbox. GitHub only mails the account's own primary address,
      # which is the company one, and changing that address would move every
      # other repository's mail with it. Sending from here with a Gmail app
      # password was the other option and it was turned down, rightly: that
      # password opens the whole Google account, not just its outbox.
      #
      # So the run posts the failure to an n8n workflow in the concaptions
      # instance, "IdeoLab blog failure to email", and n8n sends the mail with
      # the Gmail account it already holds. No credential of any kind lives in
      # this repository; the secret is only the address to post to, and the step
      # is skipped when it is not set.
      - name: Send the failure to a personal inbox
        if: failure() && steps.gate.outputs.run == 'yes' && env.N8N_ALERT_URL != ''
        run: |
          payload=$(jq -nc \
            --arg site "${{ matrix.site }}" \
            --rawfile reason reason.txt \
            --arg run "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            '{site: $site, reason: $reason, run: $run}')
          code=$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d "$payload" "$N8N_ALERT_URL")
          echo "n8n answered $code"
